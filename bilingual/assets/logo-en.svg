  <text x="180" y="84" font-family="'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="900" fill="#1a4a7a">Caifeng</text>
  <text x="180" y="104" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#666" letter-spacing="1.5">PRIVATE TOURS · XINJIANG</text>
