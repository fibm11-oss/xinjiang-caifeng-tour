<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>上傳我的旅程照片 · 北疆大環線</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f1ea;color:#2b2620;padding-bottom:40px}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px}
  header h1{font-size:20px;margin:0 0 2px}
  header p{margin:0;color:#7a6f5e;font-size:13px;line-height:1.5}
  .card{background:#fff;border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .card h2{font-size:15px;margin:0 0 10px;color:#9a6a2f;display:flex;align-items:center;gap:6px}
  .tok-row{display:flex;gap:8px;align-items:center}
  .tok-row code{flex:1;background:#f4f1ea;border-radius:8px;padding:8px 10px;font-size:13px;word-break:break-all}
  button{padding:10px 14px;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-weight:600}
  .b-primary{background:#9a6a2f;color:#fff}
  .b-ghost{background:#fff;border:1px solid #d8cdb6;color:#5a5142}
  .b-soft{background:#efe7d6;color:#6b5a3e}
  .b:disabled{opacity:.45;cursor:not-allowed}
  .loc-status{font-size:14px;line-height:1.6;min-height:20px}
  .loc-status .acc{color:#9aa;font-size:12px;margin-left:6px}
  .zone-tag{display:inline-block;background:#eef3ec;color:#3f6b3a;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
  select{width:100%;padding:10px 12px;border:1px solid #d8cdb6;border-radius:10px;font-size:14px;background:#fff;margin-top:8px}
  .hidden{display:none!important}
  .upload-zone{margin-top:12px}
  .preview{width:100%;border-radius:12px;display:block;margin:10px 0;max-height:300px;object-fit:cover;background:#eee}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
  .chip{position:relative;background:#f4f1ea;border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;line-height:1.3;cursor:pointer;border:1px solid transparent}
  .chip .n{font-weight:700;font-size:12px}
  .chip.done{background:#e7f0e4;border-color:#bfe0b4;color:#3f6b3a}
  .chip.sel{outline:2px solid #9a6a2f}
  .chip .mark{position:absolute;top:2px;right:4px;font-size:11px}
  .offline-banner{background:#fff3cd;color:#8a6d1f;border:1px solid #ecd9b0;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
  .msg{font-size:13px;margin-top:8px;min-height:16px}
  .msg.ok{color:#3f6b3a}
  .msg.err{color:#b4452f}
  .progress{font-size:14px;font-weight:700;color:#5a5142}
  .hint{font-size:12px;color:#9a8f7d;line-height:1.5;margin-top:6px}
  input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📷 上傳我的旅程照片</h1>
    <p>每到一站，配合定位上傳一張照片；行程結束後，我們會為您編纂專屬路書。</p>
  </header>

  <div class="card">
    <h2>① 您的姓名</h2>
    <div id="nameBox" class="tok-row hidden">
      <code id="nameCode"></code>
    </div>
    <div id="nameInput" class="tok-row">
      <input id="nameField" placeholder="請輸入報名時的姓名（如 張三）" style="flex:1;padding:10px 12px;border:1px solid #d8cdb6;border-radius:10px;font-size:14px">
      <button class="b-primary" onclick="setName()">確認</button>
    </div>
    <div class="hint">請輸入主辦方登記的姓名；上傳與日後下載路書共用此姓名。</div>
  </div>

  <div id="main" class="hidden">
    <div id="offlineBar" class="offline-banner hidden">⚠️ 目前離線 — 照片會先暫存，連線後自動補傳。</div>

    <div class="card">
      <h2>② 定位我的所在站點</h2>
      <div class="loc-status" id="locStatus">尚未定位。</div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="b-primary" id="locBtn" onclick="locate()">📍 定位並辨識</button>
        <button class="b-ghost" id="relocBtn" onclick="locate()">重新定位</button>
      </div>
      <div class="hint">若定位不到（如在站點間移動或訊號弱），可手動選擇：</div>
      <select id="manualZone" onchange="manualSelect(this.value)">
        <option value="">— 手動選擇站點 —</option>
      </select>
    </div>

    <div class="card" id="uploadCard">
      <h2>③ 上傳本站照片</h2>
      <div id="uploadZone" class="upload-zone hidden">
        <span class="zone-tag" id="selZoneName">—</span>
        <span class="hint" id="selZoneMeta"></span>
        <div class="tok-row" style="margin-top:10px">
          <button class="b-soft" onclick="pickPhoto()">📸 拍照 / 選擇照片</button>
        </div>
        <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="onPick(event)">
        <img id="preview" class="preview hidden" alt="preview">
        <div class="tok-row">
          <button class="b-primary" id="upBtn" onclick="upload()" disabled>⬆ 上傳到本站台</button>
        </div>
        <div class="msg" id="upMsg"></div>
      </div>
      <div class="hint" id="noZoneHint">請先定位或手動選擇站點，再上傳照片。</div>
    </div>

    <div class="card">
      <h2>④ 上傳進度</h2>
      <div class="progress" id="progress">已上傳 0 / 0 站</div>
      <div class="grid" id="grid"></div>
      <div class="hint">每站一張；重新上傳會取代原圖。狀態與伺服器即時同步，可由不同裝置續傳。</div>
    </div>
  </div>
</div>

<script src="./js/geo.js"></script>
<script src="./js/zones.js"></script>
<script>
(function(){
  "use strict";
  const BASE = location.origin; // 同埠（:8787）由 platform_server 提供
  function api(u){ return BASE + u; }
  function getParam(n){ return new URLSearchParams(location.search).get(n); }

  let TOKEN = null;   // 後端私有金鑰，由姓名解析而來，客戶不需看見
  let NAME = null;    // 客戶輸入的姓名（顯示用）
  let selectedZoneId = null;
  let serverHas = {};            // zoneId -> true（伺服器真實狀態）
  let pending = {};              // zoneId -> dataUrl（離線佇列）
  let currentDataUrl = null;     // 當前待傳照片

  // ── 姓名 → token 解析（客戶只需輸入姓名）──────────────
  function setName(){
    const v = document.getElementById('nameField').value.trim();
    if(!v){ alert('請輸入您的姓名'); return; }
    resolveByName(v);
  }
  function resolveByName(name){
    fetch(api('/api/trip/resolve?name=' + encodeURIComponent(name)))
      .then(r=>r.json().then(j=>({r,j})).catch(()=>({r, j:{}})))
      .then(({r,j})=>{
        if(r.ok && j.ok){
          TOKEN = j.token; NAME = name;
          history.replaceState(null,'', '?name=' + encodeURIComponent(NAME));
          showMain();
        }else{
          alert('查無此姓名「'+name+'」，請確認拼字，或聯絡主辦方是否已完成報名登記。');
        }
      })
      .catch(()=> alert('網路錯誤，無法確認姓名，請稍後再試。'));
  }
  function showMain(){
    document.getElementById('nameInput').classList.add('hidden');
    document.getElementById('nameBox').classList.remove('hidden');
    document.getElementById('nameCode').textContent = NAME || TOKEN;
    document.getElementById('main').classList.remove('hidden');
    loadPending();
    setNet();
    buildManual();
    buildGrid();
    loadStatus();
  }

  // ── 手動選單 + 進度格（皆由 zones.js 單一事實源生成）─────
  function buildManual(){
    const sel = document.getElementById('manualZone');
    XJZones.ZONES.forEach(z=>{
      const o = document.createElement('option');
      o.value = z.id; o.textContent = z.name + '（' + z.days + '）';
      sel.appendChild(o);
    });
  }
  function buildGrid(){
    const g = document.getElementById('grid');
    g.innerHTML = '';
    XJZones.ZONES.forEach(z=>{
      const c = document.createElement('div');
      c.className = 'chip'; c.id = 'chip-'+z.id;
      c.innerHTML = '<div class="n">'+z.name+'</div><div class="mark" id="mk-'+z.id+'"></div>';
      c.onclick = ()=> manualSelect(z.id);
      g.appendChild(c);
    });
    renderGrid();
  }
  function renderGrid(){
    let done = 0;
    XJZones.ZONES.forEach(z=>{
      const isDone = !!serverHas[z.id] || !!pending[z.id];
      const chip = document.getElementById('chip-'+z.id);
      const mk = document.getElementById('mk-'+z.id);
      chip.classList.toggle('done', isDone);
      chip.classList.toggle('sel', z.id === selectedZoneId);
      mk.textContent = isDone ? '✓' : '';
      if(isDone) done++;
    });
    document.getElementById('progress').textContent =
      '已上傳 ' + done + ' / ' + XJZones.ZONES.length + ' 站';
  }

  // ── 定位 + 地理圍欄 ─────────────────────────────────────
  function setLocStatus(html){ document.getElementById('locStatus').innerHTML = html; }

  function locate(){
    if(!navigator.geolocation){
      setLocStatus('此裝置不支援定位，請手動選擇站點。');
      return;
    }
    setLocStatus('📡 定位中…');
    navigator.geolocation.getCurrentPosition(
      pos=>{
        const {latitude, longitude, accuracy} = pos.coords;
        // 手機 GPS = WGS-84；zone 坐標是 GCJ-02 → 先轉換再判定
        const [glng, glat] = XJGeo.wgs84ToGcj02(longitude, latitude);
        const zone = XJGeo.resolveZone({latitude:glat, longitude:glng}, XJZones.ZONES);
        const accTxt = accuracy ? '<span class="acc">±'+Math.round(accuracy)+' m</span>' : '';
        if(zone){
          setLocStatus('已辨識：<span class="zone-tag">'+zone.name+'</span> '+accTxt
            +'<div class="hint">對應 '+zone.days+'</div>');
          selectZone(zone.id);
        }else{
          setLocStatus('當前位置不在任一站點圍欄內'+accTxt
            +'。<br>請移動到景點附近，或手動選擇站點。');
        }
      },
      err=>{
        const map = {1:'權限被拒絕',2:'定位不可用（可能是飛航模式/無訊號）',3:'定位逾時'};
        setLocStatus('定位失敗：'+(map[err.code]||err.message)+'，請手動選擇站點。');
      },
      {enableHighAccuracy:true, timeout:15000, maximumAge:60000}
    );
  }

  function manualSelect(zid){
    if(!zid){ return; }
    selectZone(zid);
    document.getElementById('manualZone').value = zid;
  }

  function selectZone(zid){
    const z = XJZones.getZoneById(zid);
    if(!z) return;
    selectedZoneId = zid;
    document.getElementById('uploadZone').classList.remove('hidden');
    document.getElementById('noZoneHint').classList.add('hidden');
    document.getElementById('selZoneName').textContent = z.name;
    document.getElementById('selZoneMeta').textContent = ' · ' + z.days + ' · ' + z.theme;
    // 若該站已上傳，提示可重新上傳取代
    const already = !!serverHas[zid] || !!pending[zid];
    setMsg(already ? '此站已有照片，重新上傳會取代原圖。' : '', already ? 'ok' : '');
    renderGrid();
  }

  // ── 拍照 / 選擇 + 壓縮 ──────────────────────────────────
  function pickPhoto(){ document.getElementById('fileInput').click(); }

  function onPick(e){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    compressImage(f, 1600, 0.82).then(dataUrl=>{
      currentDataUrl = dataUrl;
      const pv = document.getElementById('preview');
      pv.src = dataUrl; pv.classList.remove('hidden');
      document.getElementById('upBtn').disabled = false;
      setMsg('照片已準備好，可上傳。', 'ok');
    }).catch(err=> setMsg('讀取照片失敗：'+err.message, 'err'));
  }

  // canvas 壓縮：縮到最長邊 maxDim，輸出 jpeg，降低弱網上傳量
  function compressImage(file, maxDim, quality){
    return new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = e=>{
        const img = new Image();
        img.onload = ()=>{
          const scale = Math.min(1, maxDim/Math.max(img.width,img.height));
          const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
          const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          try{ res(cv.toDataURL('image/jpeg', quality)); }
          catch(err){ rej(err); }
        };
        img.onerror = ()=>rej(new Error('圖片解碼失敗'));
        img.src = e.target.result;
      };
      r.onerror = ()=>rej(new Error('檔案讀取失敗'));
      r.readAsDataURL(file);
    });
  }

  // ── 上傳（含離線佇列）──────────────────────────────────
  function online(){ return navigator.onLine !== false; }

  function upload(){
    if(!selectedZoneId){ setMsg('請先選擇站點', 'err'); return; }
    if(!currentDataUrl){ setMsg('請先拍照或選擇照片', 'err'); return; }
    if(!online()){
      queuePending(selectedZoneId, currentDataUrl);
      setMsg('目前離線，照片已暫存，連線後自動補傳。', 'ok');
      return;
    }
    doUpload(selectedZoneId, currentDataUrl);
  }

  function doUpload(zid, dataUrl){
    setMsg('上傳中…');
    document.getElementById('upBtn').disabled = true;
    fetch(api('/api/photo/upload'), {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token:TOKEN, zoneId:zid, image:dataUrl, ext:'jpg'})
    }).then(r=>r.json().then(j=>({r,j}))).then(({r,j})=>{
      if(r.ok && j.ok){
        delete pending[zid]; savePending();
        currentDataUrl = null;
        document.getElementById('preview').classList.add('hidden');
        document.getElementById('fileInput').value = '';
        document.getElementById('upBtn').disabled = true;
        setMsg('✓ 已上傳到本站台', 'ok');
        loadStatus(); // 同步伺服器真實狀態
      }else{
        queuePending(zid, dataUrl);
        setMsg('上傳失敗（'+(j.error||r.status)+'），已暫存稍後重試。', 'err');
        document.getElementById('upBtn').disabled = false;
      }
    }).catch(err=>{
      queuePending(zid, dataUrl);
      setMsg('網路錯誤：'+err.message+'，已暫存稍後重試。', 'err');
      document.getElementById('upBtn').disabled = false;
    });
  }

  // ── 離線佇列（localStorage，跨重新整理；記憶體為降級兜底）──
  function pendingKey(){ return 'xj_pending_' + TOKEN; }
  function savePending(){
    try{ localStorage.setItem(pendingKey(), JSON.stringify(pending)); }
    catch(e){ /* 超出配額：保留記憶體中的 pending 即可 */ }
    renderGrid();
  }
  function queuePending(zid, dataUrl){
    pending[zid] = dataUrl;
    savePending();
    setNet();
  }
  function loadPending(){
    try{
      const raw = localStorage.getItem(pendingKey());
      if(raw) pending = JSON.parse(raw) || {};
    }catch(e){ pending = {}; }
  }
  function flushPending(){
    const ids = Object.keys(pending);
    if(!ids.length) return;
    if(!online()){ return; }
    ids.forEach(zid=>{
      const d = pending[zid];
      if(d) doUpload(zid, d);
    });
  }

  // ── 伺服器狀態 ─────────────────────────────────────────
  function loadStatus(){
    if(!TOKEN) return;
    fetch(api('/api/photo/status?token=' + encodeURIComponent(TOKEN)))
      .then(r=>r.json()).then(j=>{
        if(j && j.ok){
          serverHas = {};
          (j.zones||[]).forEach(z=>{ if(z.hasPhoto) serverHas[z.id]=true; });
          renderGrid();
        }
      }).catch(()=>{ /* 狀態非關鍵，靜默 */ });
  }

  // ── 網路狀態指示 ───────────────────────────────────────
  function setNet(){
    const bar = document.getElementById('offlineBar');
    if(!online()) bar.classList.remove('hidden');
    else bar.classList.add('hidden');
  }
  window.addEventListener('online', ()=>{ setNet(); flushPending(); });
  window.addEventListener('offline', setNet);

  function setMsg(t, cls){
    const m = document.getElementById('upMsg');
    m.textContent = t; m.className = 'msg' + (cls?(' '+cls):'');
  }

  // ── 啟動 ───────────────────────────────────────────────
  const t0 = getParam('token');
  const n0 = getParam('name');
  if(t0){ TOKEN = t0; NAME = null; showMain(); }
  else if(n0){ NAME = n0; resolveByName(n0); }
})();
</script>
</body>
</html>
